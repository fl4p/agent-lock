# One board (XIAO ESP32-S3 Plus + JD9853 panel on /dev/cu.usbmodem1101). Both names were
# registered separately on 2026-09-13 and two sessions held one each while a third flashed
# under the other (the mxo4/scope incident again). Canonical = the name that was held then.
# 2026-09-14 22:43, THE SAME BOARD AGAIN: a third name, esp32s3-2a28, was registered for
# 7C:4F:AD:20:2A:28 while xiao-s3-jd9853 already covered it, and was held while another
# session was flashing the board lock-free. Three names, one board. Folded in as an alias.
# The MAC is the identity (docs/boards.md in esp32-perf): before registering a board name,
# check whether its MAC already has one.
