# OTRONIC ESP32-S3 N16R8 clone, MAC 34:85:18:98:15:88 (esptool flash-id 2026-08-14, recorded
# in ~/dev/pv/smart-shunt-fw/platformio.ini [env:esp32s3_n16r8]). NOT a XIAO, despite earlier
# notes. Two roles: valley frame-rate stand-in (esp32-perf) and host for the shunt-adc
# ADS1262 board (pwr-metering). Canonical renamed to `ftr` on 2026-09-18 at Fab's request;
# esp32s3-1588 is the name peers registered it under on 2026-09-14, kept as an alias.
ftr: esp32s3-1588 n16r8 esp32s3-n16r8
esp32s3-4c8c:
# Fab's real logged-in Chrome (playwright-extension MCP). `!session` = acquire/wait/run REFUSE
# without --session: every sub-agent of one Claude session shares its pid, and on 2026-10-06
# two of them (FIL, AIN) both "held" this pid-only and drove the browser at once. Nothing in
# the environment differs between siblings (CLAUDE_CODE_SESSION_ID, PASEO_AGENT_ID are shared),
# so the id must come from `lock.sh newsession <label>`.
# `!lease=900` (2026-10-06): a session limit killed every sub-agent at ~18:05 and FARTCOIN's
# lock stayed held 66+ min, because its pid was the still-live parent. A holder now renews by
# calling `mine fab-chrome --session <id> --quiet` before every browser action and at least every 7 min.
# `!maxhold=1200` (Fab, 2026-10-14 "fix the design"): one acquisition lasts at most 20 min, renewals
# included. A Mouser crawl held this lock 22+ h, renewing while it sat behind a challenge, and
# starved every other session. Fab's Chrome is for short fetches; crawls use a scratch profile.
fab-chrome: !session !lease=900 !maxhold=1200
