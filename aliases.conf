# lock.sh resource registry — the closed world of lockable resource names.
#
# WHY THIS FILE EXISTS. lock.sh used to treat the resource name as an opaque string, so
# `mxo4` and `scope` were independent mutexes over the SAME MXO44. On 2026-08-12/13 two
# sessions held one each and both believed they had exclusive access; it only surfaced when
# the other session's commit revealed the SW probe was off the node during a capture run.
# A typo'd name had the same shape: `scpoe` GRANTED a lock rather than refusing one.
#
# So an unregistered name is now an ERROR, not a silently-new lock. Add a real new resource
# deliberately, either by editing this file or with `lock.sh acquire <name> --new` (which
# appends it here, so it is only ever "new" once).
#
# FORMAT
#   canonical: alias alias ...     one resource, its canonical lock name first
#   !name: reason                  a name that must NEVER resolve, with the reason shown
#   # comment
#
# Aliases are for names that mean the SAME PHYSICAL THING. Do not alias two instruments
# together to save typing — that over-locks, which is its own failure. If a name is
# ambiguous between two real resources, ban it with `!` and make the caller say which.

# --- bench instruments -------------------------------------------------------------
scope: mxo mxo4 mxo44 mxo-4 osc oscilloscope
dmm6500: dmm65 keithley
hp3458a: hp3458 3458a
korad: psu-korad
lcr: lcr-pro1 tweezers

# --- rigs and boards ---------------------------------------------------------------
fugu-rig: rig powerloop power-loop loop-rig powerrig
fboost:
fbuck:
flu:
ftall:
fry:
flat:
fmetal:

# --- ambiguous names: refuse, do not guess -----------------------------------------
!dmm: ambiguous — this bench has two (dmm6500, hp3458a); name the one you mean
!psu: ambiguous — name the supply (korad, ...)
!board: ambiguous — name the board (flu, fbuck, fboost, ftall, ...)
!bench: too broad to be a mutex — lock the instrument or rig you actually touch
